name: Apply v3.2 review hardening
# retry: 3 — fixed-size payload chunks with end-to-end checksums

on:
  push:
    branches:
      - review-hardening-v3.2.0
    paths:
      - .github/workflows/apply-review-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply patch and run deterministic verification
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          chunks=(.review-hardening/chunk-*)
          test "${#chunks[@]}" -eq 6
          for index in $(seq 0 4); do
            chunk="$(printf '%03d' "$index")"
            test "$(wc -c < ".review-hardening/chunk-${chunk}")" -eq 2000
          done
          test "$(wc -c < .review-hardening/chunk-005)" -eq 684

          cat .review-hardening/chunk-* > /tmp/review-hardening.b64
          test "$(wc -c < /tmp/review-hardening.b64)" -eq 10684
          echo "1a0ab561f8768c46e3e6d53288f27f20594bad855903004076dd65d88b7919db  /tmp/review-hardening.b64" | sha256sum -c -
          base64 --decode /tmp/review-hardening.b64 > /tmp/review-hardening.py.gz
          echo "08cc9c35392db7cc2349b806f172f4643abb2fb564c6c04b1b74d1a3dac498dd  /tmp/review-hardening.py.gz" | sha256sum -c -
          gzip -dc /tmp/review-hardening.py.gz > .review-hardening/apply.py
          echo "3d7cc4264a2d50aab4067d20747c258942efed7825e72b353c48bb7d9e9b2e0d  .review-hardening/apply.py" | sha256sum -c -

          python3 .review-hardening/apply.py
          rm -rf .review-hardening

          # The one-shot workflow is not a distributable package file. Hide it
          # only while exact-set release metadata and tests are generated.
          mv .github/workflows/apply-review-hardening.yml /tmp/apply-review-hardening.yml
          trap 'mv /tmp/apply-review-hardening.yml .github/workflows/apply-review-hardening.yml 2>/dev/null || true' EXIT

          python3 scripts/update_release_metadata.py
          python3 -m compileall -q skills/insane-research/scripts scripts benchmarks tests
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_package.py
          python3 scripts/update_release_metadata.py --check
          python3 scripts/verify_release.py
          git diff --check

          mv /tmp/apply-review-hardening.yml .github/workflows/apply-review-hardening.yml
          trap - EXIT

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden v3.2 report audit and benchmark contracts"
          git push origin HEAD:review-hardening-v3.2.0
