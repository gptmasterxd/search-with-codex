name: Apply v3.2 review hardening
# retry: 2 — corrected the v3.2-only changelog insertion target

on:
  push:
    branches:
      - review-hardening-v3.2.0
    paths:
      - .github/workflows/apply-review-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply patch and run deterministic verification
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode .review-hardening/apply.py.gz.b64 \
            | gzip -dc > .review-hardening/apply.py
          python3 .review-hardening/apply.py
          rm -rf .review-hardening

          # The one-shot workflow is not a distributable package file. Hide it
          # only while exact-set release metadata and tests are generated.
          mv .github/workflows/apply-review-hardening.yml /tmp/apply-review-hardening.yml
          trap 'mv /tmp/apply-review-hardening.yml .github/workflows/apply-review-hardening.yml 2>/dev/null || true' EXIT

          python3 scripts/update_release_metadata.py
          python3 -m compileall -q skills/insane-research/scripts scripts benchmarks tests
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_package.py
          python3 scripts/update_release_metadata.py --check
          python3 scripts/verify_release.py
          git diff --check

          mv /tmp/apply-review-hardening.yml .github/workflows/apply-review-hardening.yml
          trap - EXIT

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden v3.2 report audit and benchmark contracts"
          git push origin HEAD:review-hardening-v3.2.0
